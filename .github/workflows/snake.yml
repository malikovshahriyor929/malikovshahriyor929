name: Generate snake animation

on:
  # Refresh once a day so the snake follows new contributions
  schedule:
    - cron: "0 0 * * *"
  # Allow running it by hand from the Actions tab
  workflow_dispatch:
  # Regenerate whenever the profile changes
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate the snake from the contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7a1880
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7a1880

      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
